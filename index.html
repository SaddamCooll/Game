<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Snake Game</title>
    <!-- Custom Favicon Added Safely -->
    <link rel="icon" type="image/png" href="/S Logo for Favicon icon.png" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        #score-board {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        #game-container {
            position: relative;
            background: #000;
            border: 4px solid #333;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
        }
        /* Overlay Menu Styles */
        #menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        #instructions {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .start-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px #2E7D32;
        }
        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #2E7D32;
        }
        #d-pad {
            display: none;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            background: #333;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px #222;
        }
        .btn:active {
            background: #444;
            box-shadow: 0 2px #222;
            transform: translateY(2px);
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        @media (max-width: 768px) {
            #d-pad {
                display: grid;
            }
        }
    </style>
</head>
<body>

    <div id="score-board">Score: <span id="score">0</span></div>
    
    <div id="game-container">
        <!-- New Menu Overlay Box placed here -->
        <div id="menu-overlay">
            <div id="instructions">
                Use standard Arrow keys or WASD to play on desktop.<br>
                Eat red food to score points. Do not hit walls!
            </div>
            <button class="start-btn" id="start-btn">Start Game</button>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="d-pad">
        <button class="btn" id="btn-up">↑</button>
        <button class="btn" id="btn-left">←</button>
        <button class="btn" id="btn-right">→</button>
        <button class="btn" id="btn-down">↓</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const menuOverlay = document.getElementById("menu-overlay");
        const startBtn = document.getElementById("start-btn");
        const instructions = document.getElementById("instructions");

        const gridSize = 20;
        let tileCountX, tileCountY;
        
        function resizeCanvas() {
            const width = Math.min(window.innerWidth - 30, 400);
            const height = Math.min(window.innerHeight - 280, 400);
            
            canvas.width = Math.floor(width / gridSize) * gridSize;
            canvas.height = Math.floor(height / gridSize) * gridSize;
            
            tileCountX = canvas.width / gridSize;
            tileCountY = canvas.height / gridSize;
        }
        
        resizeCanvas();

        // Game State Variables
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let gameSpeed = 150; 
        let changingDirection = false;
        let gameRunning = false; // Prevents game from updating before delay ends

        // New Countdown Functionality
        function handleStartClick() {
            startBtn.style.display = "none"; // Hide button immediately
            let timeLeft = 2;
            instructions.innerHTML = `<span style="font-size: 28px; font-weight: bold; color: #4CAF50;">Starts in ${timeLeft}...</span>`;
            
            const countdown = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    instructions.innerHTML = `<span style="font-size: 28px; font-weight: bold; color: #4CAF50;">Starts in ${timeLeft}...</span>`;
                } else {
                    clearInterval(countdown);
                    menuOverlay.style.display = "none"; // Remove dark menu overlay completely
                    gameRunning = true;
                    startGame(); // Start loop execution safely
                }
            }, 1000);
        }

        function startGame() {
            resetFood();
            clearInterval(gameInterval); // Clean loose intervals
            gameInterval = setInterval(update, gameSpeed);
        }

        function update() {
            if (!gameRunning) return; // Freeze frames if menu countdown is ticking

            if (hasGameEnded()) {
                clearInterval(gameInterval);
                gameRunning = false;
                alert(`Game Over! Final Score: ${score}`);
                resetGame();
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = "#4CAF50";
            snake.forEach((part, index) => {
                if (index === 0) ctx.fillStyle = "#388E3C";
                else ctx.fillStyle = "#4CAF50";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                resetFood();
            } else {
                snake.pop();
            }
        }

        function drawFood() {
            ctx.fillStyle = "#FF5252";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function randomCoord(max) {
            return Math.floor(Math.random() * max);
        }

        function resetFood() {
            food.x = randomCoord(tileCountX);
            food.y = randomCoord(tileCountY);
            
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) resetFood();
            });
        }

        function hasGameEnded() {
            const head = snake[0];
            const hitLeftWall = head.x < 0;
            const hitRightWall = head.x >= tileCountX;
            const hitTopWall = head.y < 0;
            const hitBottomWall = head.y >= tileCountY;

            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) return true;
            }

            return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
        }

        function changeDirection(newDx, newDy) {
            if (changingDirection || !gameRunning) return; // Prevent parsing directions inside overlay menu
            
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (newDx === 1 && !goingLeft) { dx = 1; dy = 0; changingDirection = true; }
            if (newDx === -1 && !goingRight) { dx = -1; dy = 0; changingDirection = true; }
            if (newDy === 1 && !goingUp) { dx = 0; dy = 1; changingDirection = true; }
            if (newDy === -1 && !goingDown) { dx = 0; dy = -1; changingDirection = true; }
        }

        function resetGame() {
            clearInterval(gameInterval);
            snake = [{ x: 10, y: 10 }];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            
            // Re-render original static frames & show overlay button screen again
            startBtn.style.display = "inline-block";
