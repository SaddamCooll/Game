<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Snake Game</title>
    <link rel="icon" type="image/png" href="/S Logo for Favicon icon.png" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        #score-board {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        #game-container {
            position: relative;
            background: #000;
            border: 4px solid #333;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
        }
        #d-pad {
            display: none;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            background: #333;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px #222;
        }
        .btn:active {
            background: #444;
            box-shadow: 0 2px #222;
            transform: translateY(2px);
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        @media (max-width: 768px) {
            #d-pad {
                display: grid;
            }
        }
    </style>
</head>
<body>

    <div id="score-board">Score: <span id="score">0</span></div>
    
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="d-pad">
        <button class="btn" id="btn-up">↑</button>
        <button class="btn" id="btn-left">←</button>
        <button class="btn" id="btn-right">→</button>
        <button class="btn" id="btn-down">↓</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        // Responsive grid system
        const gridSize = 20;
        let tileCountX, tileCountY;
        
        function resizeCanvas() {
            const width = Math.min(window.innerWidth - 30, 400);
            const height = Math.min(window.innerHeight - 280, 400);
            
            // Snap to nearest grid multiple
            canvas.width = Math.floor(width / gridSize) * gridSize;
            canvas.height = Math.floor(height / gridSize) * gridSize;
            
            tileCountX = canvas.width / gridSize;
            tileCountY = canvas.height / gridSize;
        }
        
        resizeCanvas();

        // Game State
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let gameSpeed = 150; 
        let changingDirection = false;

        function startGame() {
            resetFood();
            gameInterval = setInterval(update, gameSpeed);
        }

        function update() {
            if (hasGameEnded()) {
                clearInterval(gameInterval);
                alert(`Game Over! Final Score: ${score}`);
                resetGame();
                return;
            }

            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = "#4CAF50";
            snake.forEach((part, index) => {
                // Head is darker green
                if (index === 0) ctx.fillStyle = "#388E3C";
                else ctx.fillStyle = "#4CAF50";
                
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                resetFood();
            } else {
                snake.pop();
            }
        }

        function drawFood() {
            ctx.fillStyle = "#FF5252";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function randomCoord(max) {
            return Math.floor(Math.random() * max);
        }

        function resetFood() {
            food.x = randomCoord(tileCountX);
            food.y = randomCoord(tileCountY);
            
            // Ensure food doesn't spawn on snake
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) resetFood();
            });
        }

        function hasGameEnded() {
            const head = snake[0];
            const hitLeftWall = head.x < 0;
            const hitRightWall = head.x >= tileCountX;
            const hitTopWall = head.y < 0;
            const hitBottomWall = head.y >= tileCountY;

            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) return true;
            }

            return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
        }

        function changeDirection(newDx, newDy) {
            if (changingDirection) return;
            
            // Prevent 180-degree reverse turns
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (newDx === 1 && !goingLeft) { dx = 1; dy = 0; changingDirection = true; }
            if (newDx === -1 && !goingRight) { dx = -1; dy = 0; changingDirection = true; }
            if (newDy === 1 && !goingUp) { dx = 0; dy = 1; changingDirection = true; }
            if (newDy === -1 && !goingDown) { dx = 0; dy = -1; changingDirection = true; }
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            startGame();
        }

        // Desktop Controls (Keyboard)
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp" || e.key === "w") changeDirection(0, -1);
            if (e.key === "ArrowDown" || e.key === "s") changeDirection(0, 1);
            if (e.key === "ArrowLeft" || e.key === "a") changeDirection(-1, 0);
            if (e.key === "ArrowRight" || e.key === "d") changeDirection(1, 0);
        });

        // Mobile Controls (D-Pad Buttons)
        document.getElementById("btn-up").addEventListener("touchstart", (e) => { e.preventDefault(); changeDirection(0, -1); });
        document.getElementById("btn-down").addEventListener("touchstart", (e) => { e.preventDefault(); changeDirection(0, 1); });
        document.getElementById("btn-left").addEventListener("touchstart", (e) => { e.preventDefault(); changeDirection(-1, 0); });
        document.getElementById("btn-right").addEventListener("touchstart", (e) => { e.preventDefault(); changeDirection(1, 0); });

        // Mouse click support for D-Pad testing on desktop
        document.getElementById("btn-up").addEventListener("click", ()
